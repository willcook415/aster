name: Extended model checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTER_PROPTEST_CASES: '4096'
      PROPTEST_CASES: '2048'
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked -p aster-core --test reference_model_tests --test aggregate_tests
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: property-regressions
          path: '**/proptest-regressions/**'
          if-no-files-found: ignore
