[package]
name = "aster-core"
version = "0.1.0"
description = "Deterministic central limit order book and matching engine core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"

[dev-dependencies]
criterion = "0.5"
proptest = "1"
tempfile = "3"

[[bench]]
name = "engine_benchmarks"
harness = false

[[bench]]
name = "scaling"
harness = false

[lints]
workspace = true
